name: Verificar cópia e restauro do Git

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/auto-backup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restauro:
    name: Cópia temporária e restauro
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restaurar a cópia num diretório separado
        shell: bash
        run: |
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          origem=$(git rev-parse HEAD)
          pacote="$temp_dir/mppt24os.bundle"
          repositorio="$temp_dir/restauro"

          git bundle create "$pacote" HEAD
          git bundle verify "$pacote"
          git init --quiet "$repositorio"
          git -C "$repositorio" fetch --quiet "$pacote" HEAD
          git -C "$repositorio" checkout --quiet --detach FETCH_HEAD

          test "$(git -C "$repositorio" rev-parse HEAD)" = "$origem"
          test -z "$(git -C "$repositorio" status --porcelain)"
          printf '%s\n' 'Cópia temporária verificada e commit restaurado.'
